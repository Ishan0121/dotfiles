# ==============================================================================
# Layout
# Default layout mode, gap spacing, and layout-specific options.
# https://docs.noctalia.dev/umbriel/layout/
#
[layout]
# mode = "scrolling"            # "scrolling", "dwindle", "master", or "stacking"
gap            = 6
extent_presets = [0.333, 0.5, 0.667]
# client_maximize = "column"    # "column" or "edges"

[layout.scrolling]
center_focused            = "never"  # "never", "always", or "on_overflow"
default_extent_fraction   = 0.5
# center_on_overview_select = false
# center_underfull_strip    = true

# [layout.dwindle]
# preserve_split    = false
# new_toward_cursor = false

# [layout.master]
# default_width_fraction = 0.55
# new_becomes_master     = false
# new_on_top             = true
# position               = "left"   # "left", "right", "top", or "bottom"

# [layout.stacking]
# drop_zones = true

# [layout.tabs]
# default_display        = "normal"
# middle_click_closes    = false
# new_tab_position       = "after_active"
# scroll_switches_tabs   = true
# wrap_focus             = true

# [layout.struts]
# left   = 0
# right  = 0
# top    = 0
# bottom = 0

# ==============================================================================
# Window Rules
# Rules apply in order; later values override earlier ones.
# https://docs.noctalia.dev/umbriel/window-rules/
#

# Default all apps to start as a maximized column, default 0.5 extent when un-maximized (matching Niri)
[[window_rule]]
default_maximize          = true
default_fullscreen        = false
default_maximize_to_edges = false
default_scrolling_extent  = 0.5

# Blur all windows over the wallpaper blur
[[window_rule]]
blur = true

# Unfocused windows at 90% opacity (matching Niri config)
[[window_rule]]
match.is_focused = false
opacity          = 0.9

[[window_rule]]
match.is_focused = true
opacity          = 1.0

# Noctalia main UI — floating
[[window_rule]]
match.app_id             = "^dev\\.noctalia\\.Noctalia$"
default_floating         = true
default_maximize         = false
default_floating_size_px = { width = 1020, height = 900 }

# Noctalia screen-share picker — floating
[[window_rule]]
match.app_id             = "^dev\\.noctalia\\.UmbrielSharePicker$"
default_floating         = true
default_maximize         = false
default_floating_size_px = { width = 800, height = 600 }

# Picture-in-Picture
[[window_rule]]
match.title      = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

# Windows notification toasts (XWayland)
[[window_rule]]
match.title      = "^notificationtoasts_.+_desktop"
default_position = { x = 0, y = 0, anchor = "bottom_right" }
default_focused  = false
default_pinned   = true

# Garuda tools — always float (from Hyprland config)
[[window_rule]]
match.app_id     = "^(garuda-assistant|garuda-boot-options|garuda-boot-repair|garuda-gamer|garuda-network-assistant|garuda-settings-manager|garuda-welcome|calamares)$"
default_floating = true
default_maximize = false

# Enable VRR and tearing for games (pairs with tearing = true in outputs.toml)
[[window_rule]]
match.content_type = "game"
vrr                = "always"
tearing            = true

# Frame the window being screencast (viewers never see this frame)
[[window_rule]]
match.is_cast_target   = true
border_color_focused   = "#40C057FF"
border_color_unfocused = "#40C057FF"

# Hide sensitive password managers from screenshots and screen captures
[[window_rule]]
match.app_id  = "^(keepassxc|org\\.gnome\\.World\\.Secrets)$"
block_capture = true

# ==============================================================================
# Layer Rules
# Styling for layer-shell surfaces (bar, dock, notifications, OSD, etc.).
# https://docs.noctalia.dev/umbriel/layer-rules/
#
[[layer_rule]]
match.namespace   = '^noctalia-(bar-[^"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^"]*)$'
blur              = true
blur_ignore_alpha = 0.5
blur_popups       = true

# Panels, dock, notifications and OSDs open over windows — live blur
[[layer_rule]]
match.namespace = '^noctalia-(notification|dock|panel|attached-panel|osd)$'
blur_optimized  = false

# ==============================================================================
# Overview
# Zoomed-out view of workspaces and windows.
# https://docs.noctalia.dev/umbriel/workspaces-overview/
#
# [overview]
# zoom                       = 0.5
# background_blur            = true
# workspace_wallpaper        = true
# shortcuts                  = true
# shortcut_keys              = "1234567890"
# scroll_factor_horizontal   = 1.0
# scroll_factor_vertical     = 1.0

# ==============================================================================
# Hot Corners
# Trigger actions by pushing the cursor into screen corners.
#
[hot_corners.top_left]
enabled  = true
delay_ms = 300
action   = "overview-open"

# [hot_corners.top_right]
# enabled  = false
# delay_ms = 500
# action   = "spawn noctalia msg panel-toggle control-center"

# [hot_corners.bottom_left]
# enabled  = false
# delay_ms = 500
# action   = "spawn noctalia msg panel-toggle launcher"

# [hot_corners.bottom_right]
# enabled  = true
# delay_ms = 500
# action   = "workspace-toggle-show-desktop"

# ==============================================================================
# Animation
# Control animation curves, durations, and transitions.
# https://docs.noctalia.dev/umbriel/animation/
#
# [animation]
# enabled     = true
# duration_ms = 250
# curve       = "easeout"       # "linear", "easein", "easeout", "easeinout", or "spring:1,900"

# Optional live workspace reveal animation (requires workspace_wipe in [include] at top):
# [animation.workspaces]
# style       = "reveal"        # "slide" (default) or "reveal"
# effect      = "workspace_wipe"
# duration_ms = 300
# curve       = "easeout"

# [animation.windows_in]
# enabled     = true
# style       = "popin"
# scale       = 0.5
# duration_ms = 250
# curve       = "easeout"

# [animation.windows_out]
# enabled     = true
# style       = "popin"
# scale       = 0.8
# duration_ms = 200

# [animation.windows_move]
# enabled     = true
# duration_ms = 250
# curve       = "easeout"

# [animation.windows_resize]
# enabled     = true
# duration_ms = 250
# curve       = "easeout"

# [animation.windows_opacity]
# enabled     = true
# curve       = "spring:1,900"
# duration_ms = 250

# [animation.dialogs]
# enabled     = true
# dim         = 0.3
# duration_ms = 250

