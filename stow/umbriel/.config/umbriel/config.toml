# Umbriel configuration — personalized for lucifer
#
# Merged and aligned with:
#   ~/.config/niri/config.kdl + noctalia_binds.kdl
#   ~/.config/hypr/hyprland.lua + noctalia_settings.lua
#
# Complete reference: https://docs.noctalia.dev/umbriel/
# Validate changes:   umbriel config validate
# Live reload:        umbriel msg config-reload

# ==============================================================================
# Includes
# Note: The [include] table must only appear ONCE in this file.
# Consolidate all required/optional configuration and effect bundles here.
# https://docs.noctalia.dev/umbriel/configuration/#include
#
[include]
files = []

[include.optional]
files = [
    # ── Bundled Effects ───────────────────────────────────────────────────────
    # Each bundle file under effects/ contains BOTH the shader preset include
    # AND the setting to activate it! Uncomment any line below to instantly
    # apply that effect without having to edit anything else:
    #
    # Cursor trails & glows:
    # "effects/cursor-trail.toml",              # Purple/lavender trailing tail (300ms fade)
    # "effects/cursor-glow.toml",               # Soft ambient glow pulsing around cursor
    # "effects/cursor-trail-path.toml",         # Curved ribbon tail with birth-phase colors
    #
    # Animated window borders:
    # "effects/border-pulse.toml",              # Ambient light pulsing outward from focused border
    # "effects/border-audio.toml",              # Audio-reactive glowing borders
    #
    # Shaders (window & screen):
    # "effects/window-scanlines.toml",          # Retro CRT scanlines shader for windows
    # "effects/screen-vignette.toml",           # Subtle edge darkening vignette for outputs
    #
    # Animations:
    # "effects/animation-workspace-wipe.toml",  # In-place hard wipe transition between workspaces
    # "effects/animation-reveal.toml",          # Window wipe-in on open, wipe-out on close
    # "effects/animation-squash.toml",          # Squash-and-settle physics on resize/move
    #
    # ── Dynamic Theme & Displays (Managed by Noctalia) ────────────────────────
    # Dynamic colors, borders, and theme generated by Noctalia
    "outputs.toml",    # Dynamic display layouts managed by Noctalia Displays plugin,
    "noctalia.toml",
]

# ==============================================================================
# Environment Variables
# Applied to child processes launched by Umbriel.
# https://docs.noctalia.dev/umbriel/configuration/#environment
#
[environment]
XCURSOR_THEME                = "Bibata-Modern-Ice"
XCURSOR_SIZE                 = "20"
GTK_THEME                    = "Colloid-Dark-Nord"
ELECTRON_OZONE_PLATFORM_HINT = "auto"
SDL_VIDEODRIVER              = "wayland"

# ==============================================================================
# General
# Autostart applications and session-level behaviors.
# https://docs.noctalia.dev/umbriel/configuration/#general
#
[general]
autostart = [
    "noctalia",
]

# XWayland options:
# xwayland = true
# Sharp X11 apps and games on scaled outputs; they see physical resolutions:
# xwayland_native_resolution = false
# Umbriel announces the X11 scale & cursor theme via XSETTINGS. Turn off to run xsettingsd:
# xwayland_xsettings = true
# Primary monitor identity for X11 games:
# xwayland_primary_output = "HDMI-A-1"

# NVIDIA sync workaround: disable if causing frame drops/stuttering:
# nvidia_sync_workaround = true

# Modal dialogs hang on and follow their parent window:
# attach_modal_dialogs = true

# Focus newly activated windows automatically:
# focus_on_activate = false

# Show cheatsheet overlay button:
show_cheatsheet = false

# ==============================================================================
# Events
# Shell commands triggered on hardware events (e.g. laptop lid switch).
# https://docs.noctalia.dev/umbriel/configuration/#events
#
[events]
lid_close = "umbriel msg output-disable eDP-1"
lid_open  = "umbriel msg output-enable eDP-1"

# ==============================================================================
# Screencast
# Target-changing protection for screensharing sessions.
# https://docs.noctalia.dev/umbriel/configuration/#screencast
#
# [screencast]
# disable_dynamic_confirmation = true

# ==============================================================================
# DRM / GPU
# Exclude secondary or legacy GPU devices from Wayland presentation.
#
# [drm]
# ignored_devices = []
# ignored_pci_addresses = []

# ==============================================================================
# Outputs
# Managed dynamically by Noctalia Displays plugin in outputs.toml (included above).
# Do not declare [output.*] here to allow outputs.toml values to apply.
# Reference documentation and available options:
# https://docs.noctalia.dev/umbriel/outputs/
#
# [output.DP-1]
# mode = "1920x1080@60"
# position = [0, 0]
# scale = 1.0
# transform = "normal"          # "normal", "90", "180", "270", "flipped", etc.
# vrr = "off"                   # "off", "on", or "fullscreen"
# hdr = "off"                   # "off", "on", or "auto"
# sdr_transfer = "gamma22"      # or "srgb"
# sdr_white = 203               # SDR reference white in cd/m2
# direct_scanout = true
# min_workspaces = 1

# ==============================================================================
# Appearance
# Global styling: corner radius, border widths, blur, shadows, and decorations.
# https://docs.noctalia.dev/umbriel/appearance/
#
[appearance]
border_width  = 2
corner_radius = 5
prefer_no_csd = true
# outer_border_width = 0
# drag_opacity = 0.75
# opaque_fullscreen = true

[appearance.blur]
radius     = 3
# passes     = 2
# brightness = 0.9
# contrast   = 0.9
# saturation = 1.1
# noise      = 0.02
# optimized  = true

# Title Bars (client-side or server-side frames):
# [appearance.title_bar]
# mode = "negotiated"                  # "off", "on", "negotiated", or "forced"
# height = 28
# font = "sans 10"
# button_position = "right"     # "right" or "left"
# buttons = ["minimize", "maximize", "close"]
# button_corner_radius = -1     # -1 follows corner_radius; 0 is square
# button_glyph = "hover"        # "always", "hover", or "never"
# button_background = true

# Tab Bars (appearance of tabbed column headers):
# [appearance.tab_bar]
# style = "titles"              # "titles" or "indicator" (thin colored slots)
# height = 24
# gap = -1                      # space between bar and window; -1 follows layout.gap
# font = "sans 10"
# visible = true                # false hides bars while tabs keep working
# hide_when_single = false
# max_tabs = 6
# overflow = "scroll"           # "scroll" or "shrink"

# Window Shadows:
# [appearance.shadow]
# enabled  = true
# softness = 10
# offset_x = 2
# offset_y = 2

# ==============================================================================
# Colors
# All colors, theme accents, and borders are dynamically generated by Noctalia
# into noctalia.toml (included at the top).
# To override manually if ever desired:
#
[colors]
backdrop = "#000000FF"

# [colors.title_bar]
# close = "#FF6B6BFF"
# maximize = "#7AA3FFFF"
# minimize = "#FFD166FF"

# ==============================================================================
# Effects
# Shaders, cursor trails, and border animations.
# Tip: The easiest way to enable effects is to uncomment the corresponding
# bundle under [include.optional] at the top of this file (e.g. "effects/cursor-trail.toml").
# If you prefer to enable effects manually, include the preset file first and set the option below.
# https://docs.noctalia.dev/umbriel/effects/
#
[effects]
# cursor = "trail"              # "trail", "glow", or "trail-path"
# border = "pulse"              # "pulse" or "audio"
# window = "scanlines"          # "scanlines"
# screen = "vignette"           # "vignette"
# in_capture = false            # show effects in screencasts/recordings
# max_fps = 0                   # 0 matches output refresh rate

# Effect Pools (cycle through multiple presets with keybinds):
# [effects.pool.borders]
# kind = "border"
# choose = ["pulse"]
# selection = "unused_first"    # "unused_first", "round_robin", or "random"

# ==============================================================================
# Input
# Keyboard, mouse, touchpad, and focus settings.
# https://docs.noctalia.dev/umbriel/input/
#
[input.keyboard]
numlock_toggle = true
# layout       = "us"
# variant      = ""
# options      = ""
# repeat_delay = 600
# repeat_rate  = 25
# track_layout = "global"

[input.focus]
follows_mouse            = "always"
follows_mouse_max_scroll = 0.0
# hover_raises             = true
# warp_mouse_to_focus      = false

[input.cursor]
theme              = "Bibata-Modern-Ice"
size               = 20
# follows_focus      = false
# hide_when_typing   = false
# hide_timeout_ms    = 0

[input.touchpad]
tap                        = true
natural_scroll             = true
# accel_profile              = "adaptive"  # "adaptive" or "flat"
# sensitivity                = 0.0
# scroll_method              = "two-finger"
# disable_while_typing       = true
# disable_on_external_mouse  = false
# drag_lock                  = "none"

# [input.mouse]
# natural_scroll    = false
# sensitivity       = 0.0
# accel_profile     = "flat"
# scroll_wheel_step = 60

# [input.touch]
# enabled       = true
# map_to_output = "eDP-1"

# ==============================================================================
# Scratchpads
# Named scratchpad containers that can auto-spawn an app when empty.
# https://docs.noctalia.dev/umbriel/scratchpad/
#
[[scratchpad]]
name              = "quick"
spawn_when_empty  = "kitty"
proportional_size = true

[[scratchpad]]
name              = "music"
spawn_when_empty  = "youtube-music"
proportional_size = true

# ==============================================================================
# Keybinds
# Defining this table replaces the built-in bind set.
#
# Syntax:  https://docs.noctalia.dev/umbriel/keybinds/
# Actions: https://docs.noctalia.dev/umbriel/actions/
#
[keybinds]
# ── Core Applications & Session ───────────────────────────────────────────────
# "Mod+I"       = { action = "umbriel msg overview-toggle", repeat = false }

# ── Core Applications & Session ───────────────────────────────────────────────
"Mod+Return"       = { action = "spawn kitty", repeat = false }
# "Mod"              = { action = "spawn noctalia msg panel-toggle launcher", repeat = false }
# "Mod+D"            = { action = "spawn noctalia msg dock-toggle", repeat = false }
"Mod+Space"        = { action = "spawn noctalia msg panel-toggle launcher", repeat = false }
"Mod+Q"            = { action = "window-close", repeat = false }
"Mod+Shift+Q"      = { action = "window-kill", repeat = false }
"Mod+Escape"       = { action = "spawn noctalia msg panel-toggle session", repeat = false }
"Ctrl+Alt+Delete"  = "session-quit"
"Mod+Shift+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }

# ── Personalized App Launchers ────────────────────────────────────────────────
"Mod+Shift+B"      = { action = "spawn google-chrome-stable", repeat = false }
"Mod+Shift+E"      = { action = "spawn luciole", repeat = false }
"Mod+Shift+C"      = { action = "spawn code", repeat = false }
"Mod+Shift+A"      = { action = "spawn antigravity-ide", repeat = false }
"Mod+Shift+Z"      = { action = "spawn kitty -- agy", repeat = false }
