"Mod+Comma"        = { action = "spawn code ~/.config/umbriel", repeat = false }
"Mod+Period"       = { action = "spawn emote", repeat = false }
"Mod+Slash"        = { action = "cheatsheet-toggle", repeat = false }
"Mod+Shift+Slash"  = { action = "spawn noctalia msg panel-toggle kenn/keybind-cheatsheet:cheatsheet", repeat = false }

# ── Noctalia Shell Panels ─────────────────────────────────────────────────────
