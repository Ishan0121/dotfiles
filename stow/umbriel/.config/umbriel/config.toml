"Mod+Shift+M"      = { action = "spawn youtube-music", repeat = false }
"Mod+Shift+Y"      = { action = "spawn google-chrome-stable --app=https://youtube.com", repeat = false }
"Mod+Shift+P"      = { action = "spawn google-chrome-stable --app=https://photos.google.com", repeat = false }

# Utilities & Config
