# Increase volume by 5 until it hits 150
# Use old style text OSD
#UP    add volume 5 ; show-text "Volume: ${volume}"
# Decrease volume by 5
#DOWN  add volume -5 ; show-text "Volume: ${volume}"

# Use uosc's internal volume display for a better UI experience
UP    add volume  5; script-binding uosc/flash-volume
DOWN  add volume -5; script-binding uosc/flash-volume

# Pause/Unpause with LEFT click
MBTN_LEFT     cycle pause

# Right click for the menu (or whatever you want it to do)
# If you want it to do nothing, just use: MBTN_RIGHT ignore
MBTN_RIGHT    script-binding uosc/menu
# If using old style OSD
#MBTN_RIGHT    contextmenu
