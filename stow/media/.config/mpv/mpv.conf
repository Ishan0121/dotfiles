#
# Example mpv configuration file
#
# Warning:
#
# The commented example options usually do _not_ set the default values. Call
# mpv with --list-options to see the default values for most options. There is
# no builtin or example mpv.conf with all the defaults.
#
#
# Configuration files are read system-wide from /usr/local/etc/mpv.conf
# and per-user from ~/.config/mpv/mpv.conf, where per-user settings override
# system-wide settings, all of which are overridden by the command line.
#
# Configuration file settings and the command line options use the same
# underlying mechanisms. Most options can be put into the configuration file
# by dropping the preceding '--'. See the man page for a complete list of
# options.
#
# Lines starting with '#' are comments and are ignored.
#
# See the CONFIGURATION FILES section in the man page
# for a detailed description of the syntax.
#
# Profiles should be placed at the bottom of the configuration file to ensure
# that settings wanted as defaults are not restricted to specific profiles.

##################
# video settings #
##################

# Start in fullscreen mode by default.
fs=no

# 200% Zoom (Scale the video by 2x within the window. Will crop)
#video-zoom=1

# Increase the window size
window-scale=1.0

# Keep the aspect ratio correct (changed from your 'no' to 'yes')
keepaspect=yes
# Ensure no scaling distortion occurs
video-unscaled=no
# Center the video and keep black bars (letterboxing)
panscan=0
# Ensure the window stays the same aspect as the video
keepaspect-window=yes
hidpi-window-scale=yes

# force starting with centered window
#geometry=50%:50%

# don't allow a new window to have a size larger than 90% of the screen size
#autofit-larger=90%x90%

# Do not close the window on exit.
#keep-open=yes

# Do not wait with showing the video window until it has loaded. (This will
# resize the window once video is loaded. Also always shows a window with
# audio.)
#force-window=immediate
force-window=yes # handles slow handshake, if there are any, less aggressive than 'immediate'

# Keep the player window on top of all other windows.
#ontop=yes

#profile=gpu-hq

# Force video to lock on the display's refresh rate, and change video and audio
# speed to some degree to ensure synchronous playback - can cause problems
# with some drivers and desktop environments.
#video-sync=display-resample


#########################################
#     UNIVERSAL MPV      #
#########################################

# --- DEFAULT SAFE CONFIG (ACTIVE) ---
# This works for AMD, Intel, and NVIDIA on both X11 and Wayland.
# It prioritizes stability and "auto-probing" drivers.
vo=gpu
profile=gpu-hq
hwdec=auto-safe
keep-open=yes


#########################################
#      HARDWARE SPECIFIC OVERRIDES      #
# (Uncomment ONE block below to optimize) #
#########################################

# --- [ CASE 1: AMD + WAYLAND ] ---
# Best for: Modern Radeon cards (RX 5000+) on Plasma Wayland.
# Use Vulkan for the smoothest frame pacing.
#vo=gpu-next
#gpu-api=opengl # you could try 'vulkan' if it works
#hwdec=vaapi

# --- [ CASE 2: NVIDIA + WAYLAND ] ---
# Best for: RTX/GTX cards on Plasma Wayland (Driver 550+).
# Uses nvdec-copy to prevent "Green Screen" or "Freeze" bugs.
#vo=gpu
#gpu-api=vulkan
#hwdec=nvdec-copy

# --- [ CASE 3: INTEL + WAYLAND ] ---
# Best for: Intel Iris Xe / UHD Graphics on Laptops.
# Low overhead VA-API decoding.
#vo=gpu
#gpu-api=vulkan
#hwdec=vaapi

# --- [ CASE 4: AMD + X11 ] ---
# Best for: Older setups or those staying on XOrg.
#vo=gpu
#gpu-api=opengl
#hwdec=vaapi

# --- [ CASE 5: NVIDIA + X11 ] ---
# Best for: Maximum stability on XOrg. 
# NVDEC works natively without 'copy' here.
#vo=gpu
#gpu-api=opengl
#hwdec=nvdec

# --- [ CASE 6: INTEL + X11 ] ---
# Best for: Older Intel HD Graphics.
#vo=gpu
#gpu-api=opengl
#hwdec=vaapi

#########################################
#           QUALITY TWEAKS              #
#########################################
# Balanced scaling for 1080p and 4K
scale=spline36
cscale=mitchell
dscale=mitchell
deband=yes
# If you have a high-end GPU (like an RTX 30/40 or RX 6000/7000)
# and a 4K monitor, uncomment these for better upscaling:
#scale=ewa_lanczos
#video-sync=display-resample
#interpolation=yes


#########################################
#           AUDIO CONFIGURATION         #
#########################################

# --- DEFAULT SAFE CONFIG (ACTIVE) ---
# High compatibility for PipeWire/PulseAudio (Standard in Garuda)
ao=pipewire
audio-channels=auto
volume-max=150
# Prevents pitch shifting when changing playback speed
audio-pitch-correction=yes

# --- SMOOTH PLAYBACK (ACTIVE) ---
# Matches video frame rate to your monitor's refresh rate (e.g. 60Hz Dells)
# Essential to prevent judder on Wayland
video-sync=display-resample
interpolation=yes
tscale=oversample

#########################################
#     AC3 / DTS PASSTHROUGH (S/PDIF)    #
# (Uncomment for Home Theater Receivers)#
#########################################
# NOTE: This bypasses system volume control and JamesDSP.
# It sends the raw bitstream to your external decoder.

# Forces ALSA to bypass PipeWire processing for bit-perfect output
#ao=alsa
# Use 'mpv --audio-device=help' to find your specific iec958 device
#audio-device=alsa/iec958:CARD=Generic,DEV=0

# Specify codecs for digital passthrough
#audio-spdif=ac3,dts,dts-hd,eac3,truehd

# Safety delay to prevent "No target node" race conditions on wake
#audio-wait-open=0.5

# --- SMOOTH PLAYBACK (ACTIVE) ---
# Matches video frame rate to your monitor's refresh rate (e.g. 60Hz Dells)
# Essential to prevent judder on Wayland
#video-sync=display-resample
#interpolation=yes
#tscale=oversample



##################
# Interface      #
##################
# Basic OSC setup
	#osc=yes
	
	# Set to 'always' so it's there when you launch
	# Force the OSC to scale with the window, not the video resolution
	# Manually set a comfortable scale for your 4K Dells (try 1.5 or 2.0)
	# This will make the font size consistent across all file types
	# Custom Garuda/Mokka blue touch for the seekbar (Approx matching your blue wrap/OS)
	#script-opts=osc-visibility=auto,osc-timetotal=yes,osc-hidetimeout=5000,osc-vidscale=no,osc-scalewindowed=1.5,osc-scalefullscreen=1.5,osc-boxalpha=150
	
	# Remember position on quit (You already had this, but it's good to keep)
	#save-position-on-quit=yes
	
	# Force the GUI mode even when called by other apps
	#player-operation-mode=cplayer

# New UOSC setup
# Disable the default OSC so uosc can take over properly
# Stops the default text from appearing when you change volume/seek
osd-level=0
osc=no
osd-bar=no
border=yes
# 2. Tell uosc NOT to draw its fake top bar (which clashes with the real one)
# Add this to script-opts in mpv.conf OR edit uosc.conf
# uosc specific scaling for your 4K Dells
# ui_scale=1.5 or 2.0 makes the fonts readable from a distance
# total_time=yes shows total instead of remaining
# This tells uosc to stay out of the way of your real Garuda title bar
script-opts-add=uosc-top_bar=never
# This ensures total time is passed to the script
script-opts-add=uosc-total_time=yes
# Custom OSD (the messages that pop up in the corner)
osd-font='Inter Bold'
osd-font-size=32
osd-color='#CCFFFFFF'
#Remember position on quit (You already had this, but it's good to keep)
save-position-on-quit=yes

##################
# Subtitles      #
##################
# Make subs look professional on 4K
sub-auto=fuzzy
sub-font='Inter Bold' # Or your preferred system font
sub-font-size=26
sub-color='#FFFFFFFF'
sub-border-size=2
sub-shadow-offset=1
sub-shadow-color='#33000000'
sub-spacing=0.5

##################
# other settings #
##################

# Pretend to be a web browser. Might fix playback with some streaming sites,
# but also will break with shoutcast streams.
#user-agent="Mozilla/5.0"

# cache settings
#
# Use 150MB input cache by default. The cache is enabled for network streams only.
#cache-default=153600
#
# Use 150MB input cache for everything, even local files.
#cache=153600
#
# Disable the behavior that the player will pause if the cache goes below a
# certain fill size.
#cache-pause=no
#
# Read ahead about 5 seconds of audio and video packets.
#demuxer-readahead-secs=5.0
#
# Raise readahead from demuxer-readahead-secs to this value if a cache is active.
#cache-secs=50.0

# Display English subtitles if available.
#slang=en

# Play Finnish audio if available, fall back to English otherwise.
#alang=fi,en

# Change subtitle encoding. For Arabic subtitles use 'cp1256'.
# If the file seems to be valid UTF-8, prefer UTF-8.
# (You can add '+' in front of the codepage to force it.)
#sub-codepage=cp1256

# You can also include other configuration files.
#include=/path/to/the/file/you/want/to/include

############
# Profiles #
############
# Auto-detect if it's a 4K file and drop the heavy scaling to save GPU
#[4k-content]
#profile-cond=width >= 3840
#scale=bilinear
#cscale=bilinear
#dscale=bilinear

# The options declared as part of profiles override global default settings,
# but only take effect when the profile is active.

# The following profile can be enabled on the command line with: --profile=eye-cancer

#[eye-cancer]
#sharpen=5
